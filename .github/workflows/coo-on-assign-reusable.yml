name: COO on issue assign (reusable)

# Reusable workflow: posts a pre-fill claude.ai/code launch URL on an
# issue when the Readiness field flips to Assigned. Called from per-repo
# thin trigger workflows at `.github/workflows/coo-on-assign.yml`, which
# fire on `issues.field_added` and delegate the gate logic here.
#
# Canonical home: coo-labs/coo-harness/.github/workflows/coo-on-assign-reusable.yml
# Centralization design: coo-memory#939 (F7); moved to coo-harness
# (public) per #939 comment because Public→Private workflow_call resolution
# fails despite access_level=organization on the target.
# Operations doc: coo-labs/coo-memory:operations/workflow-centralization.md
# Workflow rationale: coo-labs/coo-memory:operations/coo-on-assign.md
#
# COO_SCOPE_REPOS source: fetched at job time from the canonical registry
# at coo-labs/.github/repos.yaml (status == "active" filter; all tiers
# including meta). Adding/archiving a repo there auto-propagates to every
# consumer thin trigger on next assignment event — no edit needed in
# this file. F17b migration: coo-memory#999. Meta-tier `.github` is in
# scope because coo-on-assign-reusable.yml itself reads repos.yaml from
# there at job time, and the COO needs write access to keep it current.
#
# Trigger contract for callers:
#   on: issues
#     types: [field_added]
#   permissions:
#     issues: write
#     contents: read
#   jobs:
#     <name>:
#       uses: coo-labs/coo-harness/.github/workflows/coo-on-assign-reusable.yml@main
#       secrets: inherit

on:
  workflow_call:

permissions:
  issues: write
  contents: read

concurrency:
  # Scope per (repo, issue). The repo prefix prevents cross-repo collisions
  # on issue numbers; rapid re-fires on the same issue queue. The assignee
  # suffix was dropped because field_added events don't carry it — the gate
  # filters out everything that isn't the intended trigger anyway.
  group: coo-on-assign-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  post-launch-link:
    # Gate: field_added events fire for ANY issue-level field value being
    # set/updated, so the field+option pair match is required to filter to
    # the intended trigger (Readiness flipping to Assigned).
    if: |
      github.event.issue_field.name == 'Readiness'
      && github.event.issue_field_value.option.name == 'Assigned'
    runs-on: ubuntu-latest
    steps:
      - name: Load active repos from canonical registry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read coo-labs/.github/repos.yaml; emit all active repos as
          # a JSON array of fully-qualified slugs for github-script to consume.
          # `.github` is public so github.token can read it without elevated
          # perms. Failure here fails the job loudly (set -e) rather than
          # silently falling back to a hardcoded list. Meta-tier (.github)
          # is included so the COO can edit repos.yaml itself when needed.
          repos_json="$(gh api repos/coo-labs/.github/contents/repos.yaml --jq '.content | @base64d' \
            | yq -r '.repos[] | select(.status == "active") | "coo-labs/" + .name' \
            | jq -R . | jq -s .)"
          if [ -z "$repos_json" ] || [ "$repos_json" = "[]" ]; then
            echo "::error::registry returned empty active-repo list; bailing rather than posting a launch URL with no repos pre-selected"
            exit 1
          fi
          {
            echo "active_repos<<EOF"
            echo "$repos_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build pre-fill URL and post launch comment
        uses: actions/github-script@v7
        env:
          COO_SCOPE_REPOS_JSON: ${{ steps.registry.outputs.active_repos }}
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const repoSlug = `${owner}/${repo}`;

            // --- Boot prompt template -------------------------------
            // Refinement of the draft proposal in coo-labs/coo-memory#801.
            // Notes:
            //  - flat numbered/lettered list, no nested indentation —
            //    template-literal preserves leading whitespace and YAML
            //    indent stripping would otherwise leak spaces into the
            //    prompt body.
            //  - Readiness-field branch (3a/3b) routes on the
            //    native Readiness field so the instance doesn't
            //    re-derive scope per-issue.
            //  - No meta framing about async or assignment context —
            //    the prompt reads as a regular invocation. The session
            //    is in fact spawned by an assignment event, but
            //    foregrounding that framing biased the instance toward
            //    excessive standby/brief-before-asking behavior.
            //  - issue.title leads the prompt so claude.ai/code's
            //    auto-naming heuristic surfaces the issue title as the
            //    session name. There is no documented session-name
            //    URL parameter — the pre-fill spec lists only
            //    prompt / prompt_url / repositories / environment
            //    (https://code.claude.com/docs/en/web-quickstart#pre-fill-sessions).
            //    Leading the prompt with the title is the only lever.
            const prompt = [
              issue.title,
              ``,
              `1. Boot first per CLAUDE.md — read every numbered step in the session-start reading order, not just the ones that seem most relevant to the task below. Skipping items because the parenthetical or this prompt seemed to enumerate a shorter set is a failure. Greet briefly.`,
              `2. Read the assigning issue: ${issue.html_url}. Read its issue type, Readiness/Priority field values, labels, milestone, comments, and any cross-referenced issues / PRs.`,
              `3. Branch by the issue's Readiness field.`,
              `3a. Readiness=Ready (or unset on a well-scoped body): implement autonomously. Open a PR when the change is complete and the verification steps in the issue (or your judgement of equivalent steps) have run green. Auto-subscribe per the PR-watch discipline in CLAUDE.md. Stand by for review.`,
              `3b. Readiness ∈ {Needs design, Needs research, Needs breakdown}, or any clarification-shaped signal in the body: do preliminary reconnaissance, draft a plan, name what you understood, what the design space is, which decisions Ven needs to make, and your recommendation. Stop after the brief — wait for Ven.`,
            ].join('\n');

            // --- Compose the pre-fill URL ---------------------------
            // URLSearchParams handles percent-encoding (incl. multi-line
            // newlines as %0A) for prompt, repositories, and model. No
            // `environment` param at MVP — Ven's last-used env is sticky.
            //
            // Pre-select ALL active coo-labs/* repos the COO has scope on.
            // The boot pass (coo-bootstrap.sh, integrity-check, identity
            // layer reads) cross-references files across these repos; a
            // session attached to only the assigning repo fails boot.
            // The assigning repo goes first so it's the obvious primary
            // in the form's repo selector.
            //
            // Loaded from the canonical registry at coo-labs/.github/repos.yaml
            // in the prior step (filter: status == "active"; all tiers
            // including meta). Adding/archiving a repo there auto-propagates
            // to every consumer thin trigger on next assignment event.
            // F17b: coo-memory#999.
            const COO_SCOPE_REPOS = JSON.parse(process.env.COO_SCOPE_REPOS_JSON);
            const repositories = [
              repoSlug,
              ...COO_SCOPE_REPOS.filter(r => r !== repoSlug),
            ].join(',');

            // Pin Opus 4.7 (1M context) — the model the COO currently runs
            // on. Without this, claude.ai/code defaults to whatever the
            // signed-in user's account default is (currently Opus 4.8 on
            // Max/Team/Enterprise). The `model` URL param is not in the
            // documented pre-fill spec (which lists only prompt /
            // prompt_url / repositories / environment) but URLSearchParams
            // adds it harmlessly; if unsupported the session just falls
            // back to account default. Verify on next assign event that
            // the spawned session is actually on 4.7; if not, switch to
            // an environment-level ANTHROPIC_MODEL setting.
            const params = new URLSearchParams({
              prompt,
              repositories,
              model: 'claude-opus-4-7[1m]',
            });
            const launchUrl = `https://claude.ai/code?${params.toString()}`;

            // --- Comment body ---------------------------------------
            const body = [
              `This issue is up. To launch a cloud COO session with the boot prompt + issue context pre-loaded:`,
              ``,
              `[**Launch COO session →**](${launchUrl})`,
              ``,
              `The session opens when you click — claude.ai/code needs a signed-in human (you) to spawn the container. Re-trigger by re-setting \`Readiness: Assigned\` to post a fresh link (e.g. after a session ends or gets stuck).`,
              ``,
              `---`,
              `<sub>posted by \`coo-on-assign\` workflow · design: coo-labs/coo-memory#801 · [operations doc](https://github.com/coo-labs/coo-memory/blob/main/operations/coo-on-assign.md)</sub>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

            core.info(`Posted launch comment on ${repoSlug}#${issue.number}`);
            core.info(`Launch URL length: ${launchUrl.length} chars`);
