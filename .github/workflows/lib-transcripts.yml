name: lib/transcripts — lint, type, test

on:
  pull_request:
    paths:
      - "lib/transcripts/**"
      - "scripts/transcript-render-backfill.py"
      - "scripts/transcript-url-backfill.py"
      - "scripts/transcript-rerender-v3-backfill.py"
      - "scripts/lifecycle/session-end-transcript-export.py"
      - "scripts/lifecycle/session-end-transcript-render.py"
      - "scripts/boot/integrity-check-e6-r2-absence.py"
      - "scripts/boot/integrity-check-e8-r2-orphan.py"
      - "scripts/lib/list-r2-transcripts.py"
      - "scripts/lib/transcript-meta-backfill.py"
      - "scripts/ci/test-transcript-render-backfill.py"
      - "scripts/ci/test-transcript-url-backfill.py"
      - "scripts/ci/test-transcript-rerender-v3-backfill.py"
      - "scripts/ci/test-session-end-transcript-export.py"
      - "scripts/ci/test-session-end-transcript-render.py"
      - "scripts/ci/test-r2-mop-up-ports.py"
      - "scripts/ci/test-lib-transcripts-parity.py"
      - "pyproject.toml"
      - ".github/workflows/lib-transcripts.yml"
  push:
    branches: [main]
    paths:
      - "lib/transcripts/**"
      - "scripts/transcript-render-backfill.py"
      - "scripts/transcript-url-backfill.py"
      - "scripts/transcript-rerender-v3-backfill.py"
      - "scripts/lifecycle/session-end-transcript-export.py"
      - "scripts/lifecycle/session-end-transcript-render.py"
      - "scripts/boot/integrity-check-e6-r2-absence.py"
      - "scripts/boot/integrity-check-e8-r2-orphan.py"
      - "scripts/lib/list-r2-transcripts.py"
      - "scripts/lib/transcript-meta-backfill.py"
      - "scripts/ci/test-transcript-render-backfill.py"
      - "scripts/ci/test-transcript-url-backfill.py"
      - "scripts/ci/test-transcript-rerender-v3-backfill.py"
      - "scripts/ci/test-session-end-transcript-export.py"
      - "scripts/ci/test-session-end-transcript-render.py"
      - "scripts/ci/test-r2-mop-up-ports.py"
      - "scripts/ci/test-lib-transcripts-parity.py"
      - "pyproject.toml"
      - ".github/workflows/lib-transcripts.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check lib/transcripts

      - name: ruff format check
        run: ruff format --check lib/transcripts

      - name: mypy strict
        run: mypy lib/transcripts

      - name: pytest with coverage
        run: pytest

      - name: parity check (lib vs scripts)
        run: python3 scripts/ci/test-lib-transcripts-parity.py

      - name: ported-script smoke (transcript-render-backfill)
        run: python3 scripts/ci/test-transcript-render-backfill.py

      - name: ported-script smoke (transcript-url-backfill)
        run: python3 scripts/ci/test-transcript-url-backfill.py

      - name: ported-script smoke (transcript-rerender-v3-backfill)
        run: python3 scripts/ci/test-transcript-rerender-v3-backfill.py

      - name: ported-script smoke (session-end-transcript-export)
        run: python3 scripts/ci/test-session-end-transcript-export.py

      - name: ported-script smoke (session-end-transcript-render)
        run: python3 scripts/ci/test-session-end-transcript-render.py

      - name: "ported-script smoke (r2-mop-up: e6/e8 + list-r2-transcripts + meta-backfill)"
        run: python3 scripts/ci/test-r2-mop-up-ports.py
