name: Bootstrap regression

# Layer-1 script-level CI for the cloud bootstrap chain.
# Tracks coo-labs/coo-harness#86. Layer-2 (SDK-driven harness test)
# lives at #85 and is out of scope here.
#
# What this catches that production currently catches via "open a fresh
# Claude Code session and watch the digest":
#   - #66 env-merge before validate
#   - #72 cached-PAT recheck on marker shortcut
#   - #73 digest path resolver
#   - #83 settings.json env injection
#
# What it does NOT cover (Layer-2 territory):
#   - Claude Code reading settings.json + loading skills + MCP startup
#   - macOS local-setup.sh surface
#   - Live 1Password / live GitHub PAT round-trips (mocked here)

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.claude/**'
      - '.mcp.json'
      - 'versions.lock'
      - 'Dockerfile'
      - '.github/workflows/bootstrap-regression.yml'
  workflow_dispatch:
    inputs:
      allowlist:
        description: "Comma-separated invariant ids to tolerate as degraded"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bootstrap-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run bootstrap-regression suite
        id: run
        env:
          # Today's expected-degraded set:
          #   - E1–E4: live MCP probes; integrity-check.sh marks them
          #     "skip" in CI by design — never appear in degraded.
          #   - F1–F4: culture-substrate invariants; skip cleanly when
          #     coo-memory is a stub without .git.
          #   - S2: env-aliases unset — production already accepts as
          #     expected-yellow per SOP §3.4 (operations/secrets/README.md).
          #     The CI fake-`op` mock returns canned values for a subset of
          #     op:// items only; aliases on uncovered items (e.g.
          #     CLOUDFLARE_API_TOKEN, GITHUB_APP_PRIVATE_KEY) stay unset.
          #     Production parity is the bar; tightening the mock to
          #     cover every credential is sibling work, not a blocker.
          # Bump this if a new structural-but-known-yellow invariant
          # lands; cite the reason in the commit message so the next
          # operator can audit.
          VADE_CI_ALLOWLIST: ${{ github.event.inputs.allowlist || 'S2' }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-bootstrap-regression.sh" "$GITHUB_WORKSPACE"

      - name: Post or update PR comment
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/post-or-update-pr-comment.sh"

      - name: Upload integrity-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-regression-${{ github.run_id }}
          path: |
            /home/user/.vade-cloud-state/integrity-check.json
            /home/user/.vade-cloud-state/setup-receipt.json
            /home/user/.vade-cloud-state/build.log
            /tmp/bootstrap-regression-summary.md
            /tmp/bootstrap-regression-result.json
          if-no-files-found: warn
          retention-days: 14

  transcript-redaction:
    # Fast standalone job for the redaction engine + Secret Registration
    # Rule. Independent of the heavy bootstrap-regression job above
    # because it doesn't need a staged workspace — just python3 + jq.
    # Origin: coo-labs/coo-logs#64.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Redaction engine — corpus + thinking + negative tests
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/test-transcript-redaction.py"

      - name: Install age (apt)
        run: sudo apt-get install -y --no-install-recommends age

      - name: Install uv
        # Required by the export hook's `#!/usr/bin/env -S uv run --script`
        # shebang. Cheap install — single statically-linked binary.
        run: |
          curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Transcript export hook — smoke (dry-run, isolated $HOME)
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/test-transcript-export.py"

      - name: Transcript export wrapper — budget contract (coo-harness#200)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/test-transcript-export-wrapper.sh"

      - name: Idle watchdog — close sequence smoke (coo-logs#67)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/test-session-idle-watchdog.sh"

      - name: Identity digest — gap-warning contract (coo-memory#1069)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/test-digest-gap-warnings.sh"

      - name: Auto-subscribe PR hook — matcher contract (wrapper + raw)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/test-auto-subscribe-pr.sh"

      - name: Git push fallback — op:// PAT resolution + leak hardening (coo-harness#457, #124)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/test-git-push-fallback.sh"

      - name: Boot brake — guard + clear hook contract (coo-memory#1082 v2 §7)
        env:
          VADE_COO_MEMORY_DIR: ${{ github.workspace }}/coo-memory
        run: |
          # Stage a minimal coo-memory checkout next to coo-harness for the
          # manifest's $VADE_COO_MEMORY_DIR — only operations/ is needed.
          mkdir -p "$VADE_COO_MEMORY_DIR/operations"
          cp "$GITHUB_WORKSPACE/scripts/ci/fixtures/boot-deliverables.yml" \
             "$VADE_COO_MEMORY_DIR/operations/boot-deliverables.yml"
          # PyYAML for the manifest reader
          pip install --quiet pyyaml
          bash "$GITHUB_WORKSPACE/scripts/ci/test-boot-brake-guard.sh"

      - name: Install yq (Go) for Group S tests
        # Group S helpers parse schema.yaml via yq. The Python yq
        # (apt's `yq`) has different syntax; install the Go binary
        # the production container ships.
        run: |
          sudo wget -q -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Integrity group S — secrets-schema invariants (coo-memory#871)
        run: |
          # jsonschema for the S1 validator path. PyYAML already
          # installed in the prior step's chain. Validator + JSON
          # Schema live under scripts/ci/fixtures/ (synced from
          # coo-memory's Track 1a; sync convention noted in the
          # test runner's _stage_memory fallback).
          pip install --quiet jsonschema pyyaml
          bash "$GITHUB_WORKSPACE/scripts/ci/test-integrity-group-s.sh"
