# VADE runtime — pinned tool versions
#
# Every tool installed in the Dockerfile must be listed here with
# its exact version and a short rationale. Unpinned dependencies
# cause silent dev-env drift across contributors; this file exists
# to prevent that class of bug.
#
# Format: <tool> <version> # <rationale>
# Last updated: 2026-04-19

# Base image
node                20.19.1   # Active LTS as of April 2026. vade-core
                              # tech stack targets Node 20 LTS per
                              # vade-core/CLAUDE.md.
debian              bookworm  # Stable, recent glibc, slim variant
                              # keeps image small (~150 MB base).

# Installed by scripts/lib/common.sh into snapshot-persistent paths
# (/home/user/.local/bin on cloud, ${HOME}/.local/bin locally).
op                  2.31.0    # 1Password CLI. Required by
                              # scripts/coo-bootstrap.sh to read the
                              # COO vault. Pinned via OP_VERSION_DEFAULT
                              # in lib/common.sh.
gh                  2.91.0    # GitHub CLI. Fallback write path under
                              # vade-coo attribution when
                              # mcp__github-coo__* is degraded (see
                              # vade-app/vade-runtime#36). Same
                              # fine-grained PAT as the MCP, via
                              # $GITHUB_MCP_PAT in GH_TOKEN. Pinned via
                              # GH_VERSION_DEFAULT in lib/common.sh.
mem0-mcp-server     0.2.1     # Mem0 stdio MCP server. Required by
                              # .mcp.json for Mem0 read/write surface
                              # availability (vade-runtime#109,
                              # MEMO-2026-04-26-16). Pinned via
                              # MEM0_MCP_SERVER_VERSION_DEFAULT in
                              # lib/common.sh. Installed via `uv tool`;
                              # baked into the Dockerfile at
                              # /usr/local/bin/mem0-mcp-server in epic
                              # #112 Stream 2.
uv                  0.11.7    # Python package/tool installer. Used
                              # only as the bootstrap for
                              # mem0-mcp-server above. Pinned to the
                              # release tarball (not the install.sh
                              # pipe) so image builds are reproducible.
                              # Bump when a new mem0-mcp-server release
                              # needs a newer uv, otherwise leave alone.
quarto              1.9.37    # Slide-deck and document rendering
                              # (markdown → revealjs / pptx / pdf via
                              # bundled pandoc + deno). Originally
                              # introduced for the 2026-shiffrin-conference
                              # talk under coo/_drafts/, kept for any
                              # future markdown-to-{pptx,pdf} workflow
                              # the chain produces. Tarball is ~131 MB —
                              # the largest single tool in the snapshot,
                              # but bundles pandoc which is independently
                              # useful. Pinned via QUARTO_VERSION_DEFAULT
                              # in lib/common.sh. Bump when a newer
                              # pandoc release is needed; track upstream
                              # at github.com/quarto-dev/quarto-cli.
                              # Not yet in the binary-vendor bundle —
                              # add to .github/workflows/publish-binary-vendor.yml
                              # as a follow-up if snapshot-build SLA
                              # benefits from consolidating the fetch.

# Consolidated binary vendor bundle. Single tarball published by
# .github/workflows/publish-binary-vendor.yml on this repo, containing
# op + gh + uv + mem0-mcp-server (with the uv-managed venv tree) at
# /home/user/.local/. Fetched by cloud-setup.sh's
# ensure_binaries_from_vendor in one curl with $GITHUB_MCP_PAT,
# replacing the four per-CDN fetches above. Pin format: SHA256 of the
# tarball as published; cloud-setup.sh sha256-verifies before untar.
# Without a pin the fetch path is a no-op (verification fails closed),
# leaving the per-binary direct-fetch fallback to handle install.
# Auto-bumped by .github/workflows/publish-binary-vendor.yml: each
# successful publish opens a PR updating the SHA on this line. The
# workflow also skips publishing when binary versions are unchanged
# since the previous bundle, so this row converges on the current
# binary-vendor-latest sha without an infinite republish loop.
binary_vendor_bundle  47130b3af9666275f44b009e1b3d3863db4e1e06743ecab9f50bfbaa5e114e77  # SHA256 of binary-vendor.tar.gz published as binary-vendor-0be1f51 (2026-05-27). Auto-bumped by publish-binary-vendor.yml after each successful publish.

# Globally installed via npm
@anthropic-ai/claude-code 1.0.120  # Claude Code CLI. Pinned to the
                                   # minor available at container
                                   # bake time; rev forward when a
                                   # new feature is needed or a
                                   # security advisory lands.
# System packages (tracked loosely; the bookworm repo pin is the
# ultimate source of truth for these). Listed for observability.
git                 debian-bookworm   # Whatever bookworm ships.
build-essential     debian-bookworm   # gcc, make, etc. for native
                                      # npm modules like `ws`.
ca-certificates     debian-bookworm   # TLS trust roots for npm.
curl                debian-bookworm   # Debugging + MCP endpoint
                                      # reachability checks.
procps              debian-bookworm   # `ps`, `top` — helpful when
                                      # dev-servers hang.
openssh-client      debian-bookworm   # `git push` over SSH for
                                      # operators who prefer it to
                                      # HTTPS+PAT.
age                 debian-bookworm   # X25519 file encryption.
                                      # Required by the session-end
                                      # transcript-export Stop hook
                                      # (vade-app/vade-agent-logs#64
                                      # Batch 2) for at-rest encryption
                                      # of redacted transcripts before
                                      # R2 upload. Recipient pubkey
                                      # committed at
                                      # scripts/lib/transcripts-recipient.age;
                                      # identity in 1Password at
                                      # op://COO/transcripts-age-key/credential.
# Python libraries resolved at run time via `uv run --script` inline
# PEP 723 metadata (no system-wide install). Listed here so the pin is
# discoverable and the bootstrap-regression CI can detect drift in
# scripts/lib/*.py and scripts/*.py shebangs.
boto3               >=1.34,<2 # AWS SDK for Python. Used by
                              # scripts/session-end-transcript-export.py
                              # to upload redacted+encrypted transcripts
                              # to Cloudflare R2 (S3-compatible API,
                              # signature_version=s3v4, region=auto).
                              # Major-version-bounded so 2.x doesn't
                              # silently break the script via API
                              # change. uv resolves on first run; cache
                              # warm afterward.
PyYAML              6.0.2     # YAML loader. Two install paths now:
                              # (a) `uv run --script` consumers (e.g.
                              # coo-memory/bin/secrets-schema-check.py,
                              # the S1 validator) resolve PyYAML via
                              # their PEP 723 metadata into UV_CACHE_DIR;
                              # (b) system-python3 consumers
                              # (scripts/boot/schema-fetch-secrets.py,
                              # scripts/hooks/boot-brake-guard.py,
                              # skill-yaml-guard.sh, bash-token-guard.sh,
                              # preuse-agent-env-scrub.sh,
                              # postuse-bash-redactor.sh, the inline
                              # python3 heredoc in
                              # scripts/lib/integrity-group-s.sh's S8
                              # env-drift classifier) resolve via system
                              # site-packages. The Debian base image
                              # currently ships python3-yaml=6.0.1-2build2
                              # under /usr/lib/python3/dist-packages,
                              # satisfying (b); ensure_pyyaml in
                              # scripts/lib/common.sh defensively installs
                              # this exact pin to
                              # /home/user/.local/lib/python3.X/site-packages
                              # at build time (snapshot-persistent),
                              # short-circuiting when (b) is already
                              # importable. PYTHONUSERBASE=/home/user/.local
                              # in settings.json env (via
                              # _write_claude_settings_paths) lets
                              # resume-time hooks find the install without
                              # sourcing common.sh. Defensive pin against
                              # a future base-image rebuild dropping
                              # python3-yaml — coo-harness#440.
jsonschema          >=4.0     # JSON Schema validator (Draft 2020-12).
                              # Used by
                              # coo-memory/bin/secrets-schema-check.py
                              # to validate operations/secrets/schema.yaml
                              # against operations/secrets/schema.schema.json
                              # (S1 invariant). Without this the S1
                              # check silently skipped and schema drift
                              # surfaced only at CI time; integrity-
                              # group-s.sh:S1 now switches to `uv run
                              # --script` so the PEP 723 metadata
                              # resolves both deps transparently.
                              # Documented gap closed by 2026-06-05
                              # epic close-out.

